name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    runs-on: ubuntu-latest

    # Los tests corren contra PostgreSQL real, no contra SQLite. El esquema de
    # este sistema es especifico de Postgres —JSONB, ARRAY, tipos ENUM, el
    # esquema api_platform, server_defaults, locks consultivos— y un motor
    # sustituto solo podia probarlo falseandolo. Ver §20 del documento de
    # arquitectura.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check app/ tests/

      - name: Run Black
        run: black --check app/ tests/

      - name: Run tests with coverage
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_NAME: siscom_test
          COGNITO_REGION: us-east-1
          COGNITO_USER_POOL_ID: us-east-1_testpool
          COGNITO_CLIENT_ID: test-client-id
          COGNITO_CLIENT_SECRET: test-client-secret
          SES_FROM_EMAIL: test@example.com
          FRONTEND_URL: http://localhost:3000
          PASETO_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

      - name: Build Docker image
        run: docker build -t siscom-admin-api:ci .

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gitleaks secret scan
        run: bash scripts/gitleaks-scan.sh

      - name: Semgrep static analysis
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/secrets

      - name: pip-audit dependency scan
        run: bash scripts/pip-audit-scan.sh

      - name: OSV dependency scan
        run: bash scripts/osv-scan.sh
